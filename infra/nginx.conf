server {
    listen 80;
    server_tokens off;
    client_max_body_size 20M;

    location /static/admin/ {
        alias /var/www/foodgram-st/backend/collected_static/admin/;
        expires 30d;
        access_log off;
    }


    location /static/rest_framework/ {
        alias /var/www/foodgram-st/backend/collected_static/rest_framework/;
        expires 30d;
        access_log off;
    }


    location /media/ {
        alias /var/www/foodgram-st/backend/media/;
        expires 30d;
        access_log off;
    }


    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
    }


    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }


    location / {
        root /var/www/foodgram-st/frontend;   
        index index.html;
        try_files $uri $uri/ /index.html;
    }


    location /static/ {
        alias /var/www/foodgram-st/frontend/static/;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        alias /var/www/foodgram-st/frontend/favicon.ico;
        access_log      off;
        log_not_found   off;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/foodgram-st/frontend;
    }
}
